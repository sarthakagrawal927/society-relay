<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="850" viewBox="0 0 1280 850" role="img" aria-labelledby="title desc">
<title id="title">Society Relay architecture</title><desc id="desc">Three simulated human perspectives interact with a FastAPI application. A Strands graph delegates report classification, negotiates shared visits, and follows missed milestones. Deterministic state transitions enforce human approval and resident verification. AWS Lambda serves the application. A private dispatcher invokes an IAM-protected AgentCore runtime using Amazon Nova Pro; DynamoDB persists state and EventBridge Scheduler resumes due work.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#526e65" stroke-width="1.5"/></marker></defs>
<rect width="1280" height="850" rx="20" fill="#f3f6f5"/>
<g font-family="Arial, sans-serif" fill="#20313a"><text x="48" y="54" font-size="15" letter-spacing="3" fill="#46695d">SOCIETY RELAY / ARCHITECTURE</text><text x="48" y="105" font-size="38" font-weight="bold">Model judgment. Verifiable state.</text><text x="48" y="137" font-size="17" fill="#61716f">A shared problem stays open until the people affected confirm the outcome.</text>
<g font-size="19" font-weight="bold"><rect x="48" y="177" width="370" height="87" rx="12" fill="white" stroke="#cad5d0"/><text x="72" y="212">Resident</text><rect x="455" y="177" width="370" height="87" rx="12" fill="white" stroke="#cad5d0"/><text x="479" y="212">Committee</text><rect x="862" y="177" width="370" height="87" rx="12" fill="white" stroke="#cad5d0"/><text x="886" y="212">Facility team</text></g>
<g font-size="15" fill="#61716f"><text x="72" y="240">Reports • consent • verification</text><text x="479" y="240">Exact quote approval • corrections</text><text x="886" y="240">Work updates • delays • completion</text></g>
<path d="M233 264V294H1047V264M640 264V305" stroke="#526e65" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="48" y="308" width="1184" height="55" rx="10" fill="#20313a"/><text x="640" y="342" text-anchor="middle" font-size="17" fill="white">Cloudflare domain → public Lambda + FastAPI → private Lambda dispatcher → IAM AgentCore</text>
<rect x="48" y="385" width="1184" height="222" rx="14" fill="#e6eeea" stroke="#c7d8ce"/><text x="72" y="414" font-size="13" letter-spacing="2" fill="#46695d">AGENTCORE / STRANDS GRAPH • BOUNDED MODEL CALLS • STORED-OUTCOME CHECKS</text>
<g fill="white" stroke="#b8cec1"><rect x="72" y="437" width="335" height="140" rx="10"/><rect x="472" y="437" width="335" height="140" rx="10"/><rect x="872" y="437" width="335" height="140" rx="10"/></g>
<g font-size="23" font-weight="bold"><text x="94" y="474">01 Sensemaker</text><text x="494" y="474">02 Coordinator</text><text x="894" y="474">03 Sentinel</text></g>
<g font-size="15" fill="#536960"><text x="94" y="504">Evidence specialist classifies reports.</text><text x="94" y="529">Validates complete report partitions.</text><text x="94" y="554">Human separation is remembered.</text><text x="494" y="504">Compares access alternatives.</text><text x="494" y="529">Requests one-visit resident consent.</text><text x="494" y="554">Respects refusal; cannot approve.</text><text x="894" y="504">Resumes due work from saved state.</text><text x="894" y="529">Flags missed vendor commitments.</text><text x="894" y="554">Cannot certify a completed repair.</text></g>
<path d="M408 500H462M808 500H862M640 363V384M640 607V629" fill="none" stroke="#526e65" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="48" y="634" width="762" height="99" rx="12" fill="white" stroke="#b8cec1"/><text x="72" y="667" font-size="19" font-weight="bold">Deterministic authority + atomic persistence</text><text x="72" y="695" font-size="15">Exact approvals • consent expires per visit • every household verifies</text><text x="72" y="718" font-size="14" fill="#61716f">DynamoDB strong reads + conditional writes • durable job leases and usage limits</text>
<rect x="834" y="634" width="398" height="99" rx="12" fill="#20313a"/><text x="856" y="667" font-size="19" fill="white" font-weight="bold">Current inference</text><text x="856" y="694" font-size="15" fill="#dce9df">Amazon Bedrock → Amazon Nova Pro</text><text x="856" y="718" font-size="14" fill="#dce9df">IAM-only runtime → real Strands tools</text>
<rect x="48" y="760" width="1184" height="50" rx="9" fill="none" stroke="#7d8c84" stroke-dasharray="6 5"/><text x="72" y="790" font-size="15" fill="#61716f">LIVE AWS — EventBridge Scheduler checks every minute. Verified model tools, human approval, and resident-confirmed closure.</text>
</g></svg>