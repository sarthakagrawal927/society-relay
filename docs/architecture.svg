<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="850" aria-labelledby="title desc" role="img" viewBox="0 0 1280 850"><title id="title">Society Relay architecture</title><desc id="desc">Three simulated human perspectives interact with a FastAPI application. A Strands graph delegates report classification, negotiates shared visits, and follows missed milestones. Deterministic state transitions enforce human approval and resident verification. AWS Lambda serves the application. A private dispatcher invokes an IAM-protected AgentCore runtime using Amazon Nova Pro; DynamoDB persists state and EventBridge Scheduler resumes due work.</desc><defs><marker id="arrow" markerHeight="8" markerWidth="8" orient="auto" refX="6" refY="3"><path fill="none" stroke="#526e65" stroke-width="1.5" d="M0 0L6 3L0 6"/></marker></defs><rect width="1280" height="850" fill="#f3f6f5" rx="20"/><g fill="#20313a" font-family="Arial, sans-serif"><text x="48" y="54" fill="#46695d" font-size="15" letter-spacing="3">SOCIETY RELAY / ARCHITECTURE</text><text x="48" y="105" font-size="38" font-weight="bold">Model judgment. Verifiable state.</text><text x="48" y="137" fill="#61716f" font-size="17">A shared problem stays open until the people affected confirm the outcome.</text><g font-size="19" font-weight="bold"><rect width="370" height="87" x="48" y="177" fill="#fff" stroke="#cad5d0" rx="12"/><text x="72" y="212">Resident</text><rect width="370" height="87" x="455" y="177" fill="#fff" stroke="#cad5d0" rx="12"/><text x="479" y="212">Committee</text><rect width="370" height="87" x="862" y="177" fill="#fff" stroke="#cad5d0" rx="12"/><text x="886" y="212">Facility team</text></g><g fill="#61716f" font-size="15"><text x="72" y="240">Reports • consent • verification</text><text x="479" y="240">Exact quote approval • corrections</text><text x="886" y="240">Work updates • delays • completion</text></g><path fill="none" stroke="#526e65" stroke-width="2" marker-end="url(#arrow)" d="M233 264V294H1047V264M640 264V305"/><rect width="1184" height="55" x="48" y="308" fill="#20313a" rx="10"/><text x="640" y="342" fill="#fff" font-size="17" text-anchor="middle">Cloudflare domain → public Lambda + FastAPI → private Lambda dispatcher → IAM AgentCore</text><rect width="1184" height="222" x="48" y="385" fill="#e6eeea" stroke="#c7d8ce" rx="14"/><text x="72" y="414" fill="#46695d" font-size="13" letter-spacing="2">AGENTCORE / STRANDS GRAPH • BOUNDED MODEL CALLS • STORED-OUTCOME CHECKS</text><g fill="#fff" stroke="#b8cec1"><rect width="335" height="140" x="72" y="437" rx="10"/><rect width="335" height="140" x="472" y="437" rx="10"/><rect width="335" height="140" x="872" y="437" rx="10"/></g><g font-size="23" font-weight="bold"><text x="94" y="474">01 Sensemaker</text><text x="494" y="474">02 Coordinator</text><text x="894" y="474">03 Sentinel</text></g><g fill="#536960" font-size="15"><text x="94" y="504">Evidence specialist classifies reports.</text><text x="94" y="529">Validates complete report partitions.</text><text x="94" y="554">Human separation is remembered.</text><text x="494" y="504">Compares access alternatives.</text><text x="494" y="529">Requests one-visit resident consent.</text><text x="494" y="554">Respects refusal; cannot approve.</text><text x="894" y="504">Resumes due work from saved state.</text><text x="894" y="529">Flags missed vendor commitments.</text><text x="894" y="554">Cannot certify a completed repair.</text></g><path fill="none" stroke="#526e65" stroke-width="2" marker-end="url(#arrow)" d="M408 500H462M808 500H862M640 363V384M640 607V629"/><rect width="762" height="99" x="48" y="634" fill="#fff" stroke="#b8cec1" rx="12"/><text x="72" y="667" font-size="19" font-weight="bold">Deterministic authority + atomic persistence</text><text x="72" y="695" font-size="15">Exact approvals • consent expires per visit • every household verifies</text><text x="72" y="718" fill="#61716f" font-size="14">DynamoDB strong reads + conditional writes • durable job leases and usage limits</text><rect width="398" height="99" x="834" y="634" fill="#20313a" rx="12"/><text x="856" y="667" fill="#fff" font-size="19" font-weight="bold">Current inference</text><text x="856" y="694" fill="#dce9df" font-size="15">Amazon Bedrock → Amazon Nova Pro</text><text x="856" y="718" fill="#dce9df" font-size="14">IAM-only runtime → real Strands tools</text><rect width="1184" height="50" x="48" y="760" fill="none" stroke="#7d8c84" stroke-dasharray="6 5" rx="9"/><text x="72" y="790" fill="#61716f" font-size="15">LIVE AWS — EventBridge Scheduler checks every minute. Verified model tools, human approval, and resident-confirmed closure.</text></g></svg>